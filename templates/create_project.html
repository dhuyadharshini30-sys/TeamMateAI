{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="page-header">

        <div class="badge">
            PROJECT ANALYZER
        </div>

        <h1>
            Create a Project
        </h1>

        <p>
            Define what your future team needs.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">

            <label>Project / Hackathon Name</label>

            <input
                type="text"
                name="project_name"
                placeholder="AI Healthcare Assistant"
                required
            >

            <label>Problem Statement</label>

            <textarea
                name="description"
                rows="7"
                placeholder="Describe your project..."
                required
            ></textarea>

            <label>Required Team Members</label>

            <input
                type="number"
                name="required_members"
                min="2"
                max="20"
                value="5"
                required
            >

            <label>
                Required Skills
            </label>

            <p class="hint">
                Separate skills using commas.
            </p>

            <input
                type="text"
                name="skills"
                placeholder="Python, AI, Flask, UI/UX, MySQL, Presentation"
                required
            >

            <button
                type="submit"
                class="primary-button full">

                Analyze Project & Continue →

            </button>

        </form>

    </div>

</div>

{% endblock %}
